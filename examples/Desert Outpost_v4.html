<script>
/*
=====================================================================
 DESERT OUTPOST RULE BOOK  (Iron Age camp builder, isometric three.js)
=====================================================================

0. WHAT KIND OF WAVE FUNCTION COLLAPSE IS THIS?
   - It is a lightweight, per-slot WFC-style solver, NOT classic tiled WFC.
   - Each slot (a tent, or one face of one tower level) has a small domain of
     options. We repeatedly (a) pick the slot with the lowest entropy
     (domain size plus a little random noise), (b) collapse it with a weighted
     random choice, (c) propagate by deleting options from neighbours.
   - There are no tile sockets, no overlapping-pattern model, no backtracking.
     A contradiction (empty domain) is resolved by a fallback value.
   - It is NOT chunked or stitched WFC (no generating regions separately and
     matching their borders). The closest thing is the cache below: settled
     tents and tower faces are pinned and only changed cells re-collapse
     around them, which behaves like incremental WFC with pre-collapsed edges.
   - On top sits a GRAPH GRAMMAR (section 5) that rewrites the camp graph.

1. DATA
   - Grid N=32 (four times the old area). kind[x][z] is 0, 't' tent, 's' sentry wall or 'w' watch tower,
     'T' Tabernacle court or 'W' oasis pond (both reserved).
   - lvl[x][z]: tent 1-3 (size), sentry 1-3 (strength), tower 1-4 (storeys).
   - G is ground height, TL is storey height of a tower.
   - build() is rerun after every edit. Pipeline order:
     tent WFC -> merge tents into large tents -> build camp graph ->
     graph grammar -> render tents -> fires/folds -> sentry walls ->
     tower WFC -> render towers -> desert dressing -> export list.

2. INPUT RULES
   - Tent / Sentry tool on an empty cell places a level 1 piece.
   - Same tool on the same kind of piece raises its level (max 3).
   - Tower tool on an empty cell places 1 storey, again raises it (max 4).
   - Clicking a different kind of piece with a tool does nothing.
   - Erase lowers a tower, tent or wall one level first, then removes it.
   - Fell tree tool (key 5): click a standing palm to cut it down. It leaves a
     stump with a few chips, remembered in the felled set until New desert.
   - Number keys 1-5 pick tools. Q/E or the rotate buttons turn the view.

3. TENT RULES (WFC)
   - Domain per tent cell: door direction (4) x goat-hair shade (4).
   - Door may not face an occupied neighbour cell (relaxed if all blocked).
   - Shade rule: an unsettled tent drops the shade of any touching tent,
     including diagonals, as long as it keeps at least one shade.
   - Courtyard rule: a tent two cells in front of a collapsed tent is forced
     to face back toward it, if that direction is still allowed.
   - Side-by-side rule: a tent touching a collapsed tent at its side is forced
     to share its door direction so the two can join.
   - STABILITY CACHE (tcache): each tent stores door, shade and a signature
     of the 3x3 kinds around it. If the signature is unchanged the result is
     reused, so tents only change when something next to them changes.
     Changing a tent's size level does not change the signature.

4. LARGE TENTS (merging)
   - After the WFC, touching tent cells are merged by scanline, taking the
     largest rectangle first: 2x3, 3x2, 2x2, 1x3, 3x1, 2x1, 1x2, 1x1.
   - Maximum footprint is 2x3 tiles. The anchor is the first cell.
   - The merged tent uses the anchor's shade and one door direction: the
     anchor's if every outer cell on that side is free, otherwise the first
     free direction of 0,1,2,3.
   - Size: depth = tiles deep - 0.2 + 0.07 per extra size level.
     Height scale = 1 + 0.2 per extra size level + 0.08 per extra tile,
     plus 0.1 for a chief tent, capped at 1.7.
   - Variants (hash of the anchor cell, so stable): 0 flat striped roof,
     1 fringed valance, 2 peaked two-slope roof with ridge pole,
     3 front awning on poles. Stripe colour is also hashed.
   - Door-side props by hash: under 0.3 water jar, under 0.6 sacks,
     under 0.8 goat hide, otherwise none.
   - Banner pole: tent size 3 or a chief tent (red pennant for chief).

5. GRAPH GRAMMAR
   - Nodes: tent (one per cell), wall, tower, fire, fold. Distance is
     Chebyshev (a diagonal neighbour counts as 1).
   - Rules run in this order, repeated up to 8 passes until none match.
     clan-chief    3 or more touching tent cells with no chief: the most
                   connected one gets role chief (bigger, banner).
     hearth        a tent with another tent within 2 and no fire within 2:
                   add a fire on the free cell nearest their centre.
     council-ring  a fire with 3 or more tents within 2 gets a stone ring.
     sheepfold     a tent touching a wall, once per tent: add a fold with
                   sheep and a thorn fence on a free cell next to both.
     gatehouse     a tower touching 2 or more wall cells gets role gate
                   (arched door on the wall side, pennant on top).
     signal-beacon a tower of 2+ storeys with no wall or tower within 2
                   loses its canopy and gets a fire basket.
   - Fires also appear when 2 or more tent doors face the same empty cell.
   - The HUD lists how often each rule fired.

6. SENTRY WALL RULES
   - Every wall cell always draws a 0.46 square stone pillar. Joining never
     changes its size.
   - Joining adds a 0.3 thick segment from the pillar to the cell edge toward
     each neighbouring wall or tower (4-neighbour). Each cell draws its own
     half using its own level, so unequal levels show a step at the joint.
   - Outward is the direction away from the camp centre (the average of all
     non-wall pieces). If there is no link on the outward side, a thin shield
     slab is added on that side, so the wall faces out.
   - Strength 1: two courses (top 0.29), thorn brush on top, outer-side brush.
     Strength 2: three courses (top 0.54), wooden stakes, brush as abatis.
     Strength 3: four courses (top 0.76), crenellated merlons, abatis.
     Thin dimensions are thickened by 10 percent per extra level.
   - A low firing step runs along the inner side of each segment.
   - Pillar top: 0 or 1 links gets a pennant, 3 or more links gets a lamp.

7. WATCH TOWER RULES
   - Storey height TL=0.7. Width shrinks by a per-material taper each storey.
   - WFC per face per storey: S arrow slit (weight 2), B log beam ends (1),
     O plain (1). A collapsed face removes its value from the faces directly
     above and below, so patterns alternate vertically.
   - Cache (scache) pins settled faces. Adding a storey only collapses the
     new faces.
   - Material variant (hash): 0 mudbrick (taper 0.05), 1 pale limestone
     (taper 0.02, band at each storey), 2 whitewashed with timber bands and
     corner buttresses (taper 0.07).
   - Crown variant (hash): 0 flat reed canopy, 1 pyramid thatch roof with tall
     corner turrets, 2 timber hoarding gallery with flat roof.
   - Parapet and merlons on every tower. Ladder on the first side with no
     neighbouring piece (not the gate side).
   - Rope bridge: two towers of equal height in line with exactly one empty
     cell between them.

8. DRESSING (hash of cell, skipped on occupied cells)
   - Under 0.04 date palm, under 0.12 thorn scrub, under 0.2 rock (collectable),
     under 0.29 dune. No cacti (New World plants).

9. DETERMINISM
   - rng(seed*17+count()) seeds fresh collapses only. hash(x,z) drives all
     variants, so they are stable. New desert changes the seed and clears
     both caches.

10. EXPORT
   - Copy layout JSON gives grid, seed and a list of pieces with kind, x, z,
     role, door dir, shade, levels, wall links and tent span [width, length].

10c. WORLD
   - Grid is 32x32. Drag on the map with any tool, or pick Pan, or use W A S D
     to move the camera. Wheel zooms out to see the whole map. Q/E rotate.
   - Tabernacle, from the sketch (long side along x, centred on the map):
         @@@@@@
         @+++-%-@
         @@@@@@
     @ is fence, + is the tent (3 tiles long), - is open court, % is the fire.
     It reserves 8x3 tiles: a fence ring whose corners sit on the outer tile
     centres, round a 6x1 interior. The tent fills the first three interior
     tiles at the west end (ram-skin red walls, dark goat-hair roof ridge along
     x, door at its east end with gold pillars and blue, purple and scarlet
     hangings). Then one tile of court, the fire on a bronze altar with rising
     smoke, and one more tile of court. The east fence, opposite the tent, has
     a one tile entrance gap framed by gold gate pillars and coloured valances.
   - Oasis: one pond (not buildable) ringed by grass with extra palms, about
     11-13 tiles from the centre. Up to three small grass patches elsewhere.
   - Flocks: four flocks of 5-8 sheep and goats. Each flock picks a grazing
     spot 2-5 tiles away, waits, then moves on. They never enter built tiles,
     the pond or the Tabernacle. Animals keep slots around the flock centre.
     While moving, a flock stops every 8-18 seconds for 3-7 seconds: most
     animals graze (head down), the rest gaze around. A day is 100 seconds
     (the chip in the top bar shows day and time). Once per day, from a random
     point in the morning to afternoon, each flock walks to the nearest pond
     shore, drinks for 6-9 seconds, then goes back to grazing.
   - Ground: one smooth mesh. Each tile has its own colour at its centre. The
     corner colours and heights are averages of the (up to 4) tiles sharing
     that corner, so sand, grass, court and water blend across tile edges and
     the pond edge slopes down. Land tile centres stay at height G.

10d. SKY AND DAY CYCLE
   - A day is 100 s (DAY). dayT starts at 12 s (morning). Phase by day
     fraction fr: dawn under .08, morning .3, midday .55, afternoon .75,
     dusk .88, then night.
   - skyAt(fr) blends keyframes of sky colour, hemisphere sky and ground
     colour, sun colour, sun intensity and hemisphere intensity. The sun
     crosses on an arc from fr .02 to .88 and fades at the horizon. A dim blue
     moon light fades in from fr .8 to .9 and out by dawn. Fires and lamps are
     emissive, so they glow at night.

10e. PENS AND NIGHT
   - Four pens (3x2 reserved tiles, kind P) are placed away from the centre
     and the starter camp, each with a one tile gate facing the map centre,
     straw floor, water trough and hay. Flock n beds down in pen n.
   - Night is fr >= .8 or fr < .06. Each flock walks to its gate (tohome),
     through it (enter), settles into slots (sleep: body lowered, head down)
     and leaves at dawn (leave). Pens are blocked to flocks by day. If the
     route is blocked by your buildings the flock just appears in its pen.

10f. RAIDS
   - First raid about 33 s in, then every 45 to 85 s after one ends. Raid now
     starts one at once. Size is 2 or 3, growing by about one raider per
     raid, max 10. Raiders (3 hp) spawn just outside a random map edge.
   - Raider AI: if a tower or wall is within 2.2 tiles they attack it, else they
     head for the nearest animal and seize it (carried on their back), then run
     to the nearest edge. A raider that leaves the map with an animal counts as
     stolen. A raider killed while carrying drops the animal safely.
   - Raiders walk round the pond and Tabernacle, enter pens, and attack any
     wall or tower that blocks their path.
   - Defence: towers shoot raiders within 3 + 0.6 x storeys tiles every 1.1 s
     (2 damage at 3+ storeys). Walls shoot within 1.8 + 0.3 x level every 1.6 s.
     Damaged pieces fire up to about twice as slowly.
   - Structure hp: tower 5 + 3 x storeys, wall 4 + 2 x level. Each raider hit
     is 1 damage every 1.1 s. Damage stages at 25, 50, 75 percent: cracks;
     rubble and scorch marks; flames. At 0 hp a storey or wall level collapses
     (a piece of level 1 is destroyed), leaving the rest at half hp.
   - Repair tool (key 7): wall 1 stone, tower 1 wood and 1 stone, full hp.
   - During a raid flocks run to their pens, like at night. At each new day a
     flock of 2 to 7 animals gains one lamb or kid.

10g. TREE AND ROCK VARIATION (hash of the tile, so it never changes)
   - Trees: 0 tall date palm with date clusters, 1 short bushy palm, 2 leaning
     palm (two trunk segments), 3 twin palm, 4 acacia with a flat umbrella
     crown, 5 tamarisk with a twisted trunk and rounded grey-green crowns.
     Oasis ring trees are palms only (types 0 to 3). Trunk and frond colours
     vary by hash. Any tree can be felled for 3 wood and leaves a stump.
   - Rocks (6 types, 6 colours, size 0.8 to 1.3): single boulder, rounded
     boulder, standing slab, cluster of three, flat slab, stacked pair.
     Collecting one gives 3 stone and leaves pebbles.

10h. TRIBE FLAGS
   - Every tent (a large merged tent counts once) flies a flag in its tribe
     colour from the roof top: pole, cloth, cream emblem square and a tail.
     Chiefs fly a larger flag on a taller pole. Flags sway in the loop.
   - Tribe comes from where the tent stands relative to the Tabernacle centre.
     Within 5.5 tiles it is Levi. Beyond that by angle: east (angle 0 is +x)
     Judah centre with Issachar and Zebulun beside it; south (+z) Reuben centre
     with Simeon and Gad; west Joseph then Benjamin; north Dan centre with
     Asher and Naphtali. The wedges are in the WEDGES table.
   - Colours from the tribes list: Reuben red, Simeon violet, Levi blue,
     Judah gold, Dan teal, Naphtali green, Gad orange, Asher olive gold,
     Issachar grey, Zebulun light blue, Joseph brown, Benjamin purple.
   - The Tribes button shows a panel of the twelve with a count of tents each.
     The export JSON carries the tribe name on every tent.

10a. RESOURCES AND COSTS
   - Inventory starts at 8 wood and 10 stone (New desert resets it) and is
     shown top-right with a palm icon (wood) and a rock icon (stone), always visible.
   - Fell tree gives 3 wood per palm and leaves a stump. Collect rocks gives
     3 stone per rock and leaves pebbles. Neither regrows.
   - Cost per level: tent 1 wood, sentry wall 2 stone, watch tower 1 wood and
     2 stone. Raising a level costs the same again.
   - Erase refunds half (rounded down) of one level's cost.
   - Without enough materials a placement or upgrade is refused with a note.
     The starter camp is free.

10b. VARIATION
   - Tents: footprint fraction 0.7-1.0 of the tile (large tents stay nearer full)
     with a small offset inside the tile. Variants 0-3 open front, 4 round
     yurt (cylinder and cone), 5 beehive dome hut, 6 closed pitched A-frame.
   - Sentry: pillar width 0.38-0.5. Variant by cell hash: 0 square stone,
     1 round cairn tower, 2 timber lookout posts with pitched roof and
     palisade stake segments. Joining never changes a cell's own shape.
   - Towers: about 40 percent are round (cylinder storeys, ring of merlons,
     conical roof). Footprint 0.8-1.0 of the tile. Crown variants 0-3, where
     3 is a pitched ridge roof; round towers always take the conical roof.

11. HOW TO EXTEND
   - New grammar rule: add [name, fn] to the rules array in grammar(). The fn
     returns how many rewrites it made.
   - New tent or tower variant: widen the hash modulo and add a branch.
   - To get classic tiled WFC: define tiles with edge sockets, then replace
     the domain objects with tile lists and the neighbour deletions with
     socket compatibility checks.
=====================================================================
*/
const N=32,G=.3,TL=.7,MAXL=4,PI=Math.PI,D4=[[0,1],[1,0],[0,-1],[-1,0]];
let seed=11,tool='t';

const moon=new THREE.DirectionalLight(0x8fa8ff,0);moon.position.set(-12,16,-8);S.add(moon);
const sun=new THREE.DirectionalLight(0xffe2b0,.95);sun.position.set(18,16,8);sun.castShadow=true;sun.shadow.mapSize.set(4096,4096);
Object.assign(sun.shadow.camera,{left:-26,right:26,top:26,bottom:-26,near:1,far:90});S.add(sun);
const mats={},M=c=>mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:.9,flatShading:true}));
const glow={},MG=c=>glow[c]||(glow[c]=new THREE.MeshStandardMaterial({color:c,emissive:c,emissiveIntensity:.9}));
const gB=new THREE.BoxGeometry(1,1,1),gP=new THREE.ConeGeometry(.8,.75,4),gC=new THREE.CylinderGeometry(1,1,1,8),gS=new THREE.SphereGeometry(1,12,6),gCone=new THREE.ConeGeometry(1,1,14);

function gen(){
  while(GR.children.length)GR.remove(GR.children[0]);tcache=new Map();scache=new Map();felled=new Set();mined=new Set();inv={wood:8,stone:10};
  const r=rng(seed*7+3),mid=N/2,ring=new Set();

  for(const d of defs){d.cd-=dt;if(d.cd>0||!raiders.length)continue;const rg=d.k==='w'?3+d.l*.6:1.8+d.l*.3;let best=null,bd=rg*rg;
    for(const r of raiders){const dx=r.m.position.x-d.cx,dz=r.m.position.z-d.cz,q=dx*dx+dz*dz;if(q<bd){bd=q;best=r}}
    if(best){d.cd=(d.k==='w'?1.1:1.6)*(1+.35*dstage(d.x,d.z));fireArrow(d,best)}}
  for(let i=arrows.length-1;i>=0;i--){const a=arrows[i];a.t+=dt;const u=Math.min(1,a.t/a.dur),tp=a.tg.m.position;
    a.m.position.set(a.sx+(tp.x-a.sx)*u,a.sy+(.3-a.sy)*u+Math.sin(PI*u)*.35,a.sz+(tp.z-a.sz)*u);a.m.lookAt(tp.x,.3,tp.z);
    if(u>=1){RG.remove(a.m);arrows.splice(i,1);if(a.tg.hp>0){a.tg.hp-=a.dmg;a.tg.hit=.15;if(a.tg.hp<=0)a.tg.dead=true}}}
  for(let i=raiders.length-1;i>=0;i--){const r=raiders[i],p=r.m.position;
    if(r.dead){killRaider(r);raiders.splice(i,1);continue}
    r.cd-=dt;r.hit=Math.max(0,r.hit-dt);r.m.scale.setScalar(1.1+(r.hit>0?.15:0));r.m.userData.hb.scale.x=Math.max(.02,.3*r.hp/3);
    let tx=null,tz=null,atk=null;
    if(r.carry||r.leave){
      if(Math.abs(p.x)>N/2+.4||Math.abs(p.z)>N/2+.4){if(r.carry){stolen++;say("A raider escaped with an animal.")}RG.remove(r.m);raiders.splice(i,1);continue}
      if(N/2-Math.abs(p.x)<N/2-Math.abs(p.z)){tx=Math.sign(p.x||1)*(N/2+2);tz=p.z}else{tz=Math.sign(p.z||1)*(N/2+2);tx=p.x}}
    else{let bd=2.2*2.2;for(const d of defs){const q=(d.cx-p.x)**2+(d.cz-p.z)**2;if(q<bd){bd=q;atk=d}}
      if(atk){tx=atk.cx;tz=atk.cz}
      else{let grab=null,bd2=1e9;for(const a of animals){const q=(a.m.position.x-p.x)**2+(a.m.position.z-p.z)**2;if(q<bd2){bd2=q;grab=a}}
        if(grab){tx=grab.m.position.x;tz=grab.m.position.z;
          if(bd2<.2){animals.splice(animals.indexOf(grab),1);FL.remove(grab.m);r.m.add(grab.m);grab.m.position.set(0,.42,0);grab.m.rotation.y=0;grab.m.scale.setScalar(.8);r.carry=grab;say("A raider seized an animal!");continue}}
        else r.leave=true}}
    if(tx!==null){const dx=tx-p.x,dz=tz-p.z,d=Math.hypot(dx,dz);
      if(atk&&d<.75){if(r.cd<=0){r.cd=1.1;hitStruct(atk.x,atk.z)}}
      else if(d>.02){const s=Math.min(r.sp*dt,d)/d,nx=p.x+dx*s,nz=p.z+dz*s,cx=cellOf(nx),cz=cellOf(nz),inb=cx>=0&&cz>=0&&cx<N&&cz<N,k=inb?kind[cx][cz]:0,
          bad=(a,b)=>a>=0&&b>=0&&a<N&&b<N&&(kind[a][b]==='W'||kind[a][b]==='T'||kind[a][b]==='s'||kind[a][b]==='w');
        if(k==='s'||k==='w'){if(r.cd<=0){r.cd=1.1;hitStruct(cx,cz)}}
        else{if(!bad(cx,cz)){p.x=nx;p.z=nz}else if(!bad(cellOf(nx),cellOf(p.z)))p.x=nx;else if(!bad(cellOf(p.x),cellOf(nz)))p.z=nz}
        r.m.rotation.y=Math.atan2(dx,dz)}}}
  if(raidActive&&!raiders.length){raidActive=false;raidT=45+Math.random()*40;say("Raid over. Check your towers and walls for damage.")}
  if(needBuild>0){needBuild-=dt;if(needBuild<=0){needBuild=0;build()}}
  const rt=raidActive?"RAID! "+raiders.length+" raiders":"Calm · raid in "+Math.ceil(Math.max(0,raidT))+"s";if(rt!==raidTxt){raidTxt=rt;$('raidn').textContent=rt}
  const ht="Herd "+(animals.length+raiders.filter(q=>q.carry).length)+" · stolen "+stolen;if(ht!==herdTxt){herdTxt=ht;$('herdn').textContent=ht}}
const clk=new THREE.Clock(),v3=new THREE.Vector3();
function loop(){const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;dayT+=dt;moveFlocks(dt,t);updateRaids(dt,t);
  {const dn=Math.floor(dayT/DAY)+1,fr=(dayT%DAY)/DAY,lbl="Day "+dn+" · "+(fr<.08?"dawn":fr<.3?"morning":fr<.55?"midday":fr<.75?"afternoon":fr<.88?"dusk":"night");skyAt(fr);if(dn!==lastDay){lastDay=dn;births()}if(lbl!==lastDayTxt){lastDayTxt=lbl;$('dayn').textContent=lbl}}
  for(const s of smoke){const u=(t*.25+s.ph)%1;s.m.position.y=s.y+u*.9;s.m.scale.setScalar(.08+u*.2);s.m.material.opacity=.55*(1-u)}
  for(const f of flags)f.g.rotation.y=f.r0+Math.sin(t*2.2+f.ph)*.18;
  cam();R.render(S,C);
  const lb=$('tlab');if(tabLabel){v3.set(tabLabel.x,tabLabel.y,tabLabel.z).project(C);lb.style.left=(v3.x*.5+.5)*innerWidth+'px';lb.style.top=(-v3.y*.5+.5)*innerHeight+'px';lb.style.display=v3.z<1?'block':'none'}
  requestAnimationFrame(loop)}
gen();loop();
</script></body></html>
