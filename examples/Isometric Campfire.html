<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Isometric Campfire</title>
<style>
:root{--panel:rgba(20,22,28,.8);--fg:#e8ecf4;--mut:#9aa3b5;--ac:#ff8a2a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;height:100%;color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#3a3a40 0%,#1b1b20 60%,#0e0e12 100%)}
canvas{display:block;touch-action:none}
#ui{position:fixed;left:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--panel);backdrop-filter:blur(8px);border-radius:12px;padding:12px 14px;width:220px;font-size:13px}
#ui label{display:flex;justify-content:space-between;margin-top:8px;color:var(--mut)}
#ui input[type=range]{width:100%;accent-color:var(--ac)}
.row{display:flex;gap:6px}
#ui button{flex:1;padding:7px;border:0;border-radius:8px;background:#2c2f38;color:var(--fg);font-weight:600;cursor:pointer}
#ui button.on{background:var(--ac);color:#1a1006}
#ui .row+.row{margin-top:8px}
#hint{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:var(--mut);font-size:12px;pointer-events:none}
</style>
</head>
<body>
<div id="hint">Drag to rotate · scroll to zoom</div>
<div id="ui">
  <div class="row"><button id="mS" class="on">Stylized</button><button id="mR">Realistic</button></div>
  <label>Fire <span id="vi">1.0</span></label><input id="i" type="range" min="0.2" max="2" step="0.05" value="1">
  <label>Smoke <span id="vs">1.0</span></label><input id="s" type="range" min="0" max="2" step="0.05" value="1">
  <label>Wind <span id="vw">0.4</span></label><input id="w" type="range" min="-1" max="1" step="0.05" value="0.4">
  <div class="row"><button id="rot" class="on">Auto-rotate</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;
document.body.appendChild(R.domElement);
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-60,80);
let zoom=1,ang=Math.PI/4,auto=true,mode='S';
function placeCam(){const d=20,e=Math.atan(1/Math.SQRT2);cam.position.set(Math.cos(ang)*d*Math.cos(e),d*Math.sin(e)+1.5,Math.sin(ang)*d*Math.cos(e));cam.lookAt(0,1.8,0)}
function resize(){const w=innerWidth,h=innerHeight,a=w/h,s=6/zoom*(a<1?1/a*.8:1);R.setSize(w,h);cam.left=-s*a;cam.right=s*a;cam.top=s;cam.bottom=-s;cam.updateProjectionMatrix()}
addEventListener('resize',resize);

scene.add(new THREE.AmbientLight(0x56608a,.5));
const moon=new THREE.DirectionalLight(0x8fa6ff,.35);moon.position.set(-6,10,4);scene.add(moon);
const fl=new THREE.PointLight(0xff7a22,3,14,1.5);fl.position.set(0,1.4,0);fl.castShadow=true;scene.add(fl);

// dirt tile
function dirtTex(){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');x.fillStyle='#5a4128';x.fillRect(0,0,128,128);
 for(let i=0;i<900;i++){const v=40+Math.random()*50|0;x.fillStyle=`rgba(${v+40},${v+20},${v-5},.5)`;x.fillRect(Math.random()*128,Math.random()*128,2+Math.random()*3,2+Math.random()*3)}
 const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(3,3);return t}
const dirt=new THREE.Mesh(new THREE.BoxGeometry(8,.4,8),new THREE.MeshLambertMaterial({map:dirtTex()}));dirt.position.y=-.2;dirt.receiveShadow=true;scene.add(dirt);
const frame=new THREE.Mesh(new THREE.BoxGeometry(8.3,.3,8.3),new THREE.MeshLambertMaterial({color:0x3a1f14}));frame.position.y=-.55;scene.add(frame);
const rm=new THREE.MeshLambertMaterial({color:0x4b4d55,flatShading:true});
[[3,3,.5],[3.4,2.4,.35],[2.5,3.5,.3]].forEach(([x,z,s])=>{const r=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rm);r.position.set(x,s*.6,z);r.rotation.set(Math.random()*3,Math.random()*3,0);r.castShadow=true;scene.add(r)});
for(let i=0;i<22;i++){const s=.05+Math.random()*.08,r=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rm);const a=Math.random()*6.28,d=1.8+Math.random()*2.2;r.position.set(Math.cos(a)*d,s*.5,Math.sin(a)*d);scene.add(r)}
const pit=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.4,.04,12),new THREE.MeshLambertMaterial({color:0x140c08}));pit.position.y=.02;scene.add(pit);

// logs
const side=new THREE.MeshLambertMaterial({color:0x3d2618,flatShading:true,emissive:0x3a0d00}),cap=new THREE.MeshLambertMaterial({color:0xb5743a,flatShading:true,emissive:0x3a1500});
for(let k=0;k<3;k++){
  const g=new THREE.Group(),m=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,2.2,8),[side,cap,cap]);
  m.rotation.z=Math.PI/2+.12;m.position.set(.75,.32,.32);m.castShadow=true;g.add(m);g.rotation.y=k*Math.PI*2/3+.3;scene.add(g);
}
// coals
const coals=[];
for(let i=0;i<8;i++){const c=new THREE.Mesh(new THREE.IcosahedronGeometry(.17+Math.random()*.08,0),new THREE.MeshBasicMaterial({color:0xff3a10}));
 const a=i/8*6.28,r=.35+Math.random()*.45;c.position.set(Math.cos(a)*r,.12,Math.sin(a)*r);c.rotation.set(Math.random()*3,Math.random()*3,0);scene.add(c);coals.push(c)}

// stylized low-poly flame tongues
const tongues=[];
const LAY=[[[1,.42,.06],[.7,.08,.03]],[[1,.62,.1],[1,.3,.05]],[[1,.95,.62],[1,.7,.15]]];
function tongue(h,r,L){
  let g=new THREE.ConeGeometry(r,h,5,5,true);g.translate(0,h/2,0);
  const p=g.attributes.position;for(let i=0;i<p.count;i++){const t=p.getY(i)/h,b=1+.55*Math.sin(Math.PI*Math.min(1,t*1.15)),sk=t*t*.25;p.setX(i,p.getX(i)*b+sk*h*.3);}
  g=g.toNonIndexed();const pos=g.attributes.position,col=new Float32Array(pos.count*3);
  for(let f=0;f<pos.count;f+=3){const t=(pos.getY(f)+pos.getY(f+1)+pos.getY(f+2))/3/h,j=.85+Math.random()*.3;
    for(let v=0;v<3;v++){const tt=Math.min(1,t+(v?0:.0)),a=LAY[L][0],b=LAY[L][1];for(let c=0;c<3;c++)col[(f+v)*3+c]=Math.min(1,(a[c]+(b[c]-a[c])*tt)*j)}}
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({vertexColors:true,transparent:true,opacity:.93,side:THREE.DoubleSide}));
  return m;
}
const flame=new THREE.Group();scene.add(flame);
[[8,.55,2.3,.55,0],[5,.45,1.7,.3,1],[3,.3,1.1,.15,2]].forEach(([n,r,h,rad,L])=>{
  for(let i=0;i<n;i++){const t=tongue(h*(.7+Math.random()*.6),r*(.8+Math.random()*.4),L),a=i/n*6.28+Math.random()*.5,d=rad*(.6+Math.random()*.7);
    t.position.set(Math.cos(a)*d,.2,Math.sin(a)*d);t.userData={bh:t.scale.y,s:Math.random()*100,f:2+Math.random()*3,a};t.rotation.y=Math.random()*6;flame.add(t);tongues.push(t)}
});

// particles
function blob(stops,noise){const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);stops.forEach(s=>g.addColorStop(s[0],s[1]));x.fillStyle=g;x.fillRect(0,0,64,64);
  if(noise)for(let i=0;i<5;i++){const px=14+Math.random()*36,py=14+Math.random()*36,gg=x.createRadialGradient(px,py,0,px,py,14);gg.addColorStop(0,'rgba(255,255,255,.35)');gg.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=gg;x.fillRect(0,0,64,64)}
  return new THREE.CanvasTexture(c)}
const fireTex=blob([[0,'rgba(255,255,255,1)'],[.35,'rgba(255,255,255,.55)'],[1,'rgba(255,255,255,0)']]);
const dotTex=blob([[0,'rgba(255,255,255,1)'],[.55,'rgba(255,255,255,.9)'],[.7,'rgba(255,255,255,.2)'],[1,'rgba(255,255,255,0)']]);
const smokeTex=blob([[0,'rgba(255,255,255,.9)'],[.5,'rgba(255,255,255,.4)'],[1,'rgba(255,255,255,0)']],true);
const P=[];
function mk(type,n){for(let i=0;i<n;i++){
  const m=new THREE.SpriteMaterial({map:type==='smoke'?smokeTex:type==='ember'?dotTex:fireTex,transparent:true,depthWrite:false,blending:type==='smoke'?THREE.NormalBlending:THREE.AdditiveBlending,opacity:0});
  const s=new THREE.Sprite(m);s.visible=false;scene.add(s);P.push({s,type,age:1e9,life:1,v:new THREE.Vector3(),seed:Math.random()*100,size:1})}}
mk('smoke',80);mk('fire',150);mk('ember',45);
const ctl={i:1,s:1,w:.4};
['i','s','w'].forEach(k=>{const e=document.getElementById(k);e.oninput=()=>{ctl[k]=+e.value;document.getElementById('v'+k).textContent=(+e.value).toFixed(1)}});
const bS=document.getElementById('mS'),bR=document.getElementById('mR'),rb=document.getElementById('rot');
function setMode(m){mode=m;bS.classList.toggle('on',m==='S');bR.classList.toggle('on',m==='R');flame.visible=m==='S'}
bS.onclick=()=>setMode('S');bR.onclick=()=>setMode('R');
rb.onclick=()=>{auto=!auto;rb.classList.toggle('on',auto)};
function spawn(p){
  const a=Math.random()*6.28,R_=mode==='R';
  if(p.type==='fire'){const r=Math.random()*.7;p.s.position.set(Math.cos(a)*r,.2,Math.sin(a)*r);p.life=.9+Math.random()*1;p.v.set(-Math.cos(a)*.3,1.8+Math.random()*1.4,-Math.sin(a)*.3);p.size=1+Math.random()*.9}
  else if(p.type==='smoke'){const h=R_?3.6:2.8,r=Math.random()*.4;p.s.position.set(Math.cos(a)*r,h+Math.random()*.4,Math.sin(a)*r);p.life=3.5+Math.random()*2.5;p.v.set((Math.random()-.5)*.2,.7+Math.random()*.4,(Math.random()-.5)*.2);p.size=.8+Math.random()*.5}
  else{const r=Math.random()*.7;p.s.position.set(Math.cos(a)*r,.6,Math.sin(a)*r);p.life=2+Math.random()*2;p.v.set((Math.random()-.5)*.9,1.3+Math.random()*1.5,(Math.random()-.5)*.9);p.size=.1+Math.random()*.1}
  p.age=0}
const cA=new THREE.Color(1,.92,.55),cB=new THREE.Color(1,.5,.1),cC=new THREE.Color(.55,.06,0),tmp=new THREE.Color();
let last=performance.now(),T=0;
function tick(now){
  const dt=Math.min((now-last)/1000,.05);last=now;T+=dt;
  if(auto)ang+=dt*.15;placeCam();
  for(const tg of tongues){const u=tg.userData,n=Math.sin(T*u.f+u.s)*.5+Math.sin(T*u.f*2.1+u.s)*.25;
    tg.scale.y=(.85+.3*n+.15)*ctl.i**.6;tg.scale.x=tg.scale.z=(.9+.15*Math.cos(T*u.f*1.3+u.s))*(.6+ctl.i*.4);
    tg.rotation.x=Math.sin(T*u.f*.8+u.s)*.12;tg.rotation.z=Math.cos(T*u.f*.7+u.s)*.12-ctl.w*.22;tg.rotation.y+=dt*.8;tg.visible=ctl.i>.25}
  for(const p of P){
    if(p.type==='fire'&&mode!=='R'){p.s.visible=false;p.age=1e9;continue}
    const rate=p.type==='smoke'?ctl.s:ctl.i;
    if(p.age>p.life){if(Math.random()<dt*rate*(p.type==='smoke'?1.3:p.type==='ember'?.7:5))spawn(p);else{p.s.visible=false;continue}}
    p.age+=dt;const t=p.age/p.life,m=p.s.material;p.s.visible=true;
    const wob=Math.sin(T*3+p.seed)*.6;
    p.s.position.x+=(p.v.x+ctl.w*(p.type==='smoke'?1.4*t:.5*t)+wob*.25*t)*dt;
    p.s.position.z+=(p.v.z+Math.cos(T*2.3+p.seed)*.2*t)*dt;
    p.s.position.y+=p.v.y*dt*(p.type==='fire'?(1.1-t*.4)*ctl.i**.4:1);
    if(p.type==='fire'){tmp.copy(t<.3?cA.clone().lerp(cB,t/.3):cB.clone().lerp(cC,(t-.3)/.7));m.color.copy(tmp);
      m.opacity=Math.min(1,(1-t)*1.5)*.7;const sc=p.size*(1-t*.7)*(.6+ctl.i*.4);p.s.scale.set(sc*.8,sc*1.7,1)}
    else if(p.type==='smoke'){const g=.17+.12*Math.sin(p.seed);m.color.setRGB(g+.1,g+.1,g+.13);m.opacity=Math.sin(Math.min(t*2.5,1)*Math.PI/2)*(1-t)*.36;const sc=p.size*(1+t*3.4);p.s.scale.set(sc,sc,1)}
    else{p.v.y-=dt*.3;m.color.setRGB(1,.55-.2*t,.15);m.opacity=(1-t*t)*(.7+.3*Math.sin(T*18+p.seed));p.s.scale.set(p.size,p.size,1)}
  }
  const f=.85+Math.sin(T*13)*.1+Math.sin(T*27.3)*.07+Math.random()*.08;
  fl.intensity=3*f*ctl.i;fl.position.x=Math.sin(T*5)*.15;fl.position.z=Math.cos(T*4.1)*.15;
  coals.forEach((c,i)=>c.material.color.setRGB(1,.12+.18*Math.sin(T*3+i*1.7)**2,.04));
  side.emissiveIntensity=.7+f*.6;
  R.render(scene,cam);requestAnimationFrame(tick)}
let dn=false,lx=0;
R.domElement.addEventListener('pointerdown',e=>{dn=true;lx=e.clientX;auto=false;rb.classList.remove('on')});
addEventListener('pointerup',()=>dn=false);
addEventListener('pointermove',e=>{if(dn){ang-=(e.clientX-lx)*.01;lx=e.clientX}});
R.domElement.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(2.5,Math.max(.6,zoom*(e.deltaY>0?.93:1.07)));resize()},{passive:false});
resize();placeCam();requestAnimationFrame(tick);
</script>
</body>
</html>
