/*
=====================================================================
 DESERT OUTPOST RULE BOOK  (Iron Age camp builder, isometric three.js)
=====================================================================

0. WHAT KIND OF WAVE FUNCTION COLLAPSE IS THIS?
   - It is a lightweight, per-slot WFC-style solver, NOT classic tiled WFC.
   - Each slot (a tent, or one face of one tower level) has a small domain of
     options. We repeatedly (a) pick the slot with the lowest entropy
     (domain size plus a little random noise), (b) collapse it with a weighted
     random choice, (c) propagate by deleting options from neighbours.
   - There are no tile sockets, no overlapping-pattern model, no backtracking.
     A contradiction (empty domain) is resolved by a fallback value.
   - It is NOT chunked or stitched WFC (no generating regions separately and
     matching their borders). The closest thing is the cache below: settled
     tents and tower faces are pinned and only changed cells re-collapse
     around them, which behaves like incremental WFC with pre-collapsed edges.
   - On top sits a GRAPH GRAMMAR (section 5) that rewrites the camp graph.

1. DATA
   - Grid N=16. kind[x][z] is 0, 't' tent, 's' sentry wall or 'w' watch tower.
   - lvl[x][z]: tent 1-3 (size), sentry 1-3 (strength), tower 1-4 (storeys).
   - G is ground height, TL is storey height of a tower.
   - build() is rerun after every edit. Pipeline order:
     tent WFC -> merge tents into large tents -> build camp graph ->
     graph grammar -> render tents -> fires/folds -> sentry walls ->
     tower WFC -> render towers -> desert dressing -> export list.

2. INPUT RULES
   - Tent / Sentry tool on an empty cell places a level 1 piece.
   - Same tool on the same kind of piece raises its level (max 3).
   - Tower tool on an empty cell places 1 storey, again raises it (max 4).
   - Clicking a different kind of piece with a tool does nothing.
   - Erase lowers a tower, tent or wall one level first, then removes it.
   - Fell tree tool (key 5): click a standing palm to cut it down. It leaves a
     stump with a few chips, remembered in the felled set until New desert.
   - Number keys 1-5 pick tools. Q/E or the rotate buttons turn the view.

3. TENT RULES (WFC)
   - Domain per tent cell: door direction (4) x goat-hair shade (4).
   - Door may not face an occupied neighbour cell (relaxed if all blocked).
   - Shade rule: an unsettled tent drops the shade of any touching tent,
     including diagonals, as long as it keeps at least one shade.
   - Courtyard rule: a tent two cells in front of a collapsed tent is forced
     to face back toward it, if that direction is still allowed.
   - Side-by-side rule: a tent touching a collapsed tent at its side is forced
     to share its door direction so the two can join.
   - STABILITY CACHE (tcache): each tent stores door, shade and a signature
     of the 3x3 kinds around it. If the signature is unchanged the result is
     reused, so tents only change when something next to them changes.
     Changing a tent's size level does not change the signature.

4. LARGE TENTS (merging)
   - After the WFC, touching tent cells are merged by scanline, taking the
     largest rectangle first: 2x3, 3x2, 2x2, 1x3, 3x1, 2x1, 1x2, 1x1.
   - Maximum footprint is 2x3 tiles. The anchor is the first cell.
   - The merged tent uses the anchor's shade and one door direction: the
     anchor's if every outer cell on that side is free, otherwise the first
     free direction of 0,1,2,3.
   - Size: depth = tiles deep - 0.2 + 0.07 per extra size level.
     Height scale = 1 + 0.2 per extra size level + 0.08 per extra tile,
     plus 0.1 for a chief tent, capped at 1.7.
   - Variants (hash of the anchor cell, so stable): 0 flat striped roof,
     1 fringed valance, 2 peaked two-slope roof with ridge pole,
     3 front awning on poles. Stripe colour is also hashed.
   - Door-side props by hash: under 0.3 water jar, under 0.6 sacks,
     under 0.8 goat hide, otherwise none.
   - Banner pole: tent size 3 or a chief tent (red pennant for chief).

5. GRAPH GRAMMAR
   - Nodes: tent (one per cell), wall, tower, fire, fold. Distance is
     Chebyshev (a diagonal neighbour counts as 1).
   - Rules run in this order, repeated up to 8 passes until none match.
     clan-chief    3 or more touching tent cells with no chief: the most
                   connected one gets role chief (bigger, banner).
     hearth        a tent with another tent within 2 and no fire within 2:
                   add a fire on the free cell nearest their centre.
     council-ring  a fire with 3 or more tents within 2 gets a stone ring.
     sheepfold     a tent touching a wall, once per tent: add a fold with
                   sheep and a thorn fence on a free cell next to both.
     gatehouse     a tower touching 2 or more wall cells gets role gate
                   (arched door on the wall side, pennant on top).
     signal-beacon a tower of 2+ storeys with no wall or tower within 2
                   loses its canopy and gets a fire basket.
   - Fires also appear when 2 or more tent doors face the same empty cell.
   - The HUD lists how often each rule fired.

6. SENTRY WALL RULES
   - Every wall cell always draws a 0.46 square stone pillar. Joining never
     changes its size.
   - Joining adds a 0.3 thick segment from the pillar to the cell edge toward
     each neighbouring wall or tower (4-neighbour). Each cell draws its own
     half using its own level, so unequal levels show a step at the joint.
   - Outward is the direction away from the camp centre (the average of all
     non-wall pieces). If there is no link on the outward side, a thin shield
     slab is added on that side, so the wall faces out.
   - Strength 1: two courses (top 0.29), thorn brush on top, outer-side brush.
     Strength 2: three courses (top 0.54), wooden stakes, brush as abatis.
     Strength 3: four courses (top 0.76), crenellated merlons, abatis.
     Thin dimensions are thickened by 10 percent per extra level.
   - A low firing step runs along the inner side of each segment.
   - Pillar top: 0 or 1 links gets a pennant, 3 or more links gets a lamp.

7. WATCH TOWER RULES
   - Storey height TL=0.7. Width shrinks by a per-material taper each storey.
   - WFC per face per storey: S arrow slit (weight 2), B log beam ends (1),
     O plain (1). A collapsed face removes its value from the faces directly
     above and below, so patterns alternate vertically.
   - Cache (scache) pins settled faces. Adding a storey only collapses the
     new faces.
   - Material variant (hash): 0 mudbrick (taper 0.05), 1 pale limestone
     (taper 0.02, band at each storey), 2 whitewashed with timber bands and
     corner buttresses (taper 0.07).
   - Crown variant (hash): 0 flat reed canopy, 1 pyramid thatch roof with tall
     corner turrets, 2 timber hoarding gallery with flat roof.
   - Parapet and merlons on every tower. Ladder on the first side with no
     neighbouring piece (not the gate side).
   - Rope bridge: two towers of equal height in line with exactly one empty
     cell between them.

8. DRESSING (hash of cell, skipped on occupied cells)
   - Under 0.04 date palm, under 0.12 thorn scrub, under 0.2 rock (collectable),
     under 0.29 dune. No cacti (New World plants).

9. DETERMINISM
   - rng(seed*17+count()) seeds fresh collapses only. hash(x,z) drives all
     variants, so they are stable. New desert changes the seed and clears
     both caches.

10. EXPORT
   - Copy layout JSON gives grid, seed and a list of pieces with kind, x, z,
     role, door dir, shade, levels, wall links and tent span [width, length].

10a. RESOURCES AND COSTS
   - Inventory starts at 8 wood and 10 stone (New desert resets it) and is
     shown top-right with a palm icon (wood) and a rock icon (stone), always visible.
   - Fell tree gives 3 wood per palm and leaves a stump. Collect rocks gives
     3 stone per rock and leaves pebbles. Neither regrows.
   - Cost per level: tent 1 wood, sentry wall 2 stone, watch tower 1 wood and
     2 stone. Raising a level costs the same again.
   - Erase refunds half (rounded down) of one level's cost.
   - Without enough materials a placement or upgrade is refused with a note.
     The starter camp is free.

10b. VARIATION
   - Tents: footprint fraction 0.7-1.0 of the tile (large tents stay nearer full)
     with a small offset inside the tile. Variants 0-3 open front, 4 round
     yurt (cylinder and cone), 5 beehive dome hut, 6 closed pitched A-frame.
   - Sentry: pillar width 0.38-0.5. Variant by cell hash: 0 square stone,
     1 round cairn tower, 2 timber lookout posts with pitched roof and
     palisade stake segments. Joining never changes a cell's own shape.
   - Towers: about 40 percent are round (cylinder storeys, ring of merlons,
     conical roof). Footprint 0.8-1.0 of the tile. Crown variants 0-3, where
     3 is a pitched ridge roof; round towers always take the conical roof.

11. HOW TO EXTEND
   - New grammar rule: add [name, fn] to the rules array in grammar(). The fn
     returns how many rewrites it made.
   - New tent or tower variant: widen the hash modulo and add a branch.
   - To get classic tiled WFC: define tiles with edge sockets, then replace
     the domain objects with tile lists and the neighbour deletions with
     socket compatibility checks.
=====================================================================
*/

const mats={},M=c=>mats[c]||(mats[c]=new THREE.MeshStandardMaterial({color:c,roughness:.9,flatShading:true}));

const isPalm=(x,z)=>hash(x,z)<.04;
const isRock=(x,z)=>{const h=hash(x,z);return h>=.12&&h<.2};
function gen(){
  while(GR.children.length)GR.remove(GR.children[0]);tcache=new Map();scache=new Map();felled=new Set();mined=new Set();inv={wood:8,stone:10};

  if(tool==='f'){if(!k&&isPalm(x,z)&&!felled.has(ky)){felled.add(ky);inv.wood+=3;say("+3 wood")}else{say("Click a standing palm to fell it.");return}}
  else if(tool==='r'){if(!k&&isRock(x,z)&&!mined.has(ky)){mined.add(ky);inv.stone+=3;say("+3 stone")}else{say("Click a rock to collect it.");return}}
  else if(tool==='x'){if(!k)return;const c=COST[k];inv.wood+=c[0]>>1;inv.stone+=c[1]>>1;if(lvl[x][z]>1)lvl[x][z]--;else{kind[x][z]=0;lvl[x][z]=0}}
  else{const up=k&&k===tool&&(k==='w'?lvl[x][z]<MAXL:(lvl[x][z]||1)<3);
    if(k&&!up)return;if(!pay(COST[tool]))return;
    if(!k){kind[x][z]=tool;lvl[x][z]=1}else lvl[x][z]=(lvl[x][z]||1)+1}
  build()}
R.domElement.addEventListener('click',act);
R.domElement.addEventListener('pointermove',e=>{const p=pick(e);if(!p){hov.visible=false;return}const x=cellOf(p.x),z=cellOf(p.z);
  hov.visible=x>=0&&z>=0&&x<N&&z<N;if(hov.visible)hov.position.set(W(x),G+.04,W(z))});
R.domElement.addEventListener('wheel',e=>{zoom=Math.max(.6,Math.min(2.2,zoom-e.deltaY*.001));proj();e.preventDefault()},{passive:false});
function setTool(t){tool=t;['t','s','w','x','f','r'].forEach(i=>$(i).classList.toggle('on',i===t));build()}
['t','s','w','x','f','r'].forEach(i=>$(i).onclick=()=>setTool(i));
$('rl').onclick=()=>yawT-=PI/2;$('rr').onclick=()=>yawT+=PI/2;
$('nw').onclick=()=>{seed=Math.floor(Math.random()*9999);gen()};
let mt=0;function say(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(mt);mt=setTimeout(()=>m.style.opacity=0,3000)}
$('ex').onclick=async()=>{const j=JSON.stringify({grid:N,seed,pieces:outRes});try{await navigator.clipboard.writeText(j);say("Layout copied.")}catch(e){say("Clipboard blocked here. Copy from the page when hosted in your own site.")}};
addEventListener('keydown',e=>{const k={1:'t',2:'s',3:'w',4:'x',5:'f',6:'r'}[e.key];if(k)setTool(k);if(e.key==='ArrowLeft'||e.key==='q')yawT-=PI/2;if(e.key==='ArrowRight'||e.key==='e')yawT+=PI/2});
addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight);proj()});R.setSize(innerWidth,innerHeight);proj();
function loop(){cam();R.render(S,C);requestAnimationFrame(loop)}
gen();loop();
</script></body></html>
